name: CI Launcher Desktop

on:
  push:
    branches:
      - "**"
    paths:
      - "launcher/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches:
      - "**"
    paths:
      - "launcher/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ci-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-desktop:
    name: Compile Launcher Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Compile desktop Launcher
        run: ./gradlew :desktopApp:compileKotlin --no-daemon --stacktrace
