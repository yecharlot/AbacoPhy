# CI — Frontend webapp (Svelte 5 + TypeScript + Vite)
# Se ejecuta en push a cualquier rama y en pull_request.
name: CI Webapp

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-webapp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webapp

jobs:
  webapp:
    name: Check & build (Svelte)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & svelte-check
        run: npm run check

      - name: Production build
        run: npm run build
