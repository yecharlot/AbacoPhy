# CI — Backend Go (ÁbacoPhy)
# Se ejecuta en push a cualquier rama y en pull_request.
name: CI Go

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build & test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify go.mod / go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod o go.sum desactualizados. Ejecuta 'go mod tidy' y commitea."
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/abacophy ./cmd/abacophy

      - name: Test
        run: go test ./... -count=1
