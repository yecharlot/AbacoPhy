# CI — KMP POS (shared + desktop)
# Compila el módulo multiplataforma y el cliente desktop.
# Se ejecuta en push a cualquier rama y en pull_request (mismo patrón que ci-go / ci-webapp).
#
# Lint (detekt/ktlint): no incluido aún.
# Motivo: el proyecto aún estabiliza Room/KSP/Compose; un lint estricto sin baseline
# bloquearía PRs por estilo sin aportar señal real. Cuando compileKotlinJvm esté
# verde de forma estable, se puede añadir detekt con baseline opcional.
name: CI KMP POS

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-kmp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: posapps

jobs:
  kmp:
    name: Compile (shared JVM + desktop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # KSP + compile del código compartido (dominio, data, UI common, Room)
      - name: Compile shared (Kotlin/JVM)
        run: ./gradlew :shared:compileKotlinJvm --no-daemon --stacktrace

      # Cliente desktop (Compose JVM) — valida enlace shared → app
      - name: Compile desktopApp
        run: ./gradlew :desktopApp:compileKotlin --no-daemon --stacktrace

      # Unit tests common si existen (no falla el job si no hay tests aún)
      - name: Unit tests shared (si hay)
        run: |
          ./gradlew :shared:allTests --no-daemon --stacktrace || \
          ./gradlew :shared:jvmTest --no-daemon --stacktrace || \
          echo "No hay tests JVM configurados aún — OK"
        continue-on-error: true
