<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4B400" />
  <title>ÁbacoPhy</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    :root, [data-theme="light"] {
      /* Paleta PrismaTEC / TCP sobre fondo claro sereno (hito buscopincha) */
      --primary: #F4B400;
      --primary-dark: #D49A00;
      --primary-soft: rgba(244,180,0,.16);
      --bg: #F7F4EC;
      --bg-elevated: #FFFFFF;
      --bg-sidebar: #FFFCF5;
      --text: #1A1A1A;
      --text-secondary: #4A4A4A;
      --text-muted: #7A7A7A;
      --border: rgba(26,26,26,.09);
      --shadow: 0 8px 28px rgba(26,26,26,.07);
      --ok: #2E7D32;
      --danger: #C62828;
      --sidebar-w: 260px;
    }
    [data-theme="dark"] {
      --primary: #F4B400;
      --primary-dark: #FB8C00;
      --primary-soft: rgba(244,180,0,.14);
      --bg: #0A0A0A;
      --bg-elevated: #141414;
      --bg-sidebar: #0F0F0F;
      --text: #FFFFFF;
      --text-secondary: #B0B0B0;
      --text-muted: #6B6B6B;
      --border: rgba(244,180,0,.15);
      --shadow: 0 8px 32px rgba(0,0,0,.4);
      --ok: #4CAF50;
      --danger: #FF5252;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }
    .hidden { display: none !important; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: none;} }

    #loginOverlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #fff8e7, var(--bg));
      padding: 20px;
    }
    [data-theme="dark"] #loginOverlay {
      background: radial-gradient(ellipse at 50% 40%, #121212, #050505);
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 28px; padding: 2rem;
      box-shadow: var(--shadow); text-align: center;
      animation: fadeUp .45s ease;
    }
    .login-card h2 { font-weight: 800; margin: .6rem 0 .25rem; letter-spacing: -.02em; }
    .login-card .muted { color: var(--text-secondary); font-size: .9rem; margin-bottom: 1.25rem; }
    .logo-mark {
      width: 52px; height: 52px; margin: 0 auto; border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: grid; place-items: center;
      box-shadow: 0 6px 18px var(--primary-soft);
    }
    .logo-mark img, .logo-mark svg { width: 28px; height: 28px; }

    #appShell { display: none; min-height: 100dvh; }
    #appShell.on { display: block; }

    .sidebar {
      width: var(--sidebar-w); position: fixed; inset: 0 auto 0 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 100;
      transition: transform .25s ease;
    }
    .sidebar-header {
      flex-shrink: 0; padding: 1.15rem 1.1rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg-sidebar); z-index: 2;
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-row h3 { font-size: .95rem; font-weight: 800; }
    .brand-row p { font-size: .65rem; color: var(--text-muted); }
    .nav { flex: 1; overflow-y: auto; padding: .55rem 0 1.25rem; -webkit-overflow-scrolling: touch; }
    .nav-item {
      margin: .15rem .55rem; padding: .7rem .9rem; border-radius: 12px;
      display: flex; align-items: center; gap: 10px; width: calc(100% - 1.1rem);
      color: var(--text-secondary); font-weight: 500; font-size: .88rem;
      cursor: pointer; border: none; background: transparent; font-family: inherit; text-align: left;
      transition: background .2s, color .2s, transform .2s;
    }
    .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; flex-shrink: 0; }
    .nav-item:hover { background: var(--primary-soft); color: var(--primary); transform: translateX(3px); }
    .nav-item.active {
      background: var(--primary-soft); color: var(--primary);
      border-left: 3px solid var(--primary); font-weight: 600;
    }

    .main { margin-left: var(--sidebar-w); padding: 1.25rem; min-height: 100dvh; animation: fadeUp .35s ease; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
    .topbar h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
    .badge {
      font-size: .62rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--primary-soft); color: var(--primary);
    }
    .badge.syncing { background: rgba(201,146,10,.2); }
    .badge.off { color: var(--danger); background: rgba(198,40,40,.08); border-color: rgba(198,40,40,.25); }
    .badge.ok { color: var(--ok); background: rgba(46,125,50,.1); border-color: rgba(46,125,50,.25); }

    .card {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 18px; padding: 1.1rem; margin-bottom: .9rem; box-shadow: var(--shadow);
      animation: fadeUp .3s ease;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .85rem; margin-bottom: .9rem; }
    .stat-card {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem; text-align: center; transition: transform .2s, border-color .2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .stat-card h3 { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-top: .25rem; }
    .stat-card small { color: var(--text-muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }

    label {
      display: block; font-size: .65rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%; padding: 11px 13px; margin-bottom: .75rem;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: inherit; font-size: .92rem;
    }
    [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea {
      background: #1A1A1A;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn {
      padding: 10px 18px; border-radius: 40px; border: none; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
      font-family: inherit; font-size: .88rem; transition: transform .2s, box-shadow .2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #0A0A0A; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 18px var(--primary-soft); }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 11px; font-size: .74rem; border-radius: 20px; }
    .btn-danger { background: var(--danger); color: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
    .section-label { font-size: .65rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }
    .muted { color: var(--text-secondary); font-size: .88rem; }
    .money { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--primary); }
    .eq { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--text-secondary); line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { text-align: left; padding: 9px 7px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--bg-elevated); border: 1px solid var(--border);
      padding: 11px 16px; border-radius: 14px; z-index: 2000; max-width: 92vw;
      box-shadow: var(--shadow); animation: fadeUp .25s ease;
    }
    .menu-toggle {
      display: none; background: transparent; border: 1px solid var(--border);
      border-radius: 10px; padding: 7px; color: var(--primary); cursor: pointer;
    }
    .menu-toggle svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    /* Splash */
    #splash {
      position: fixed; inset: 0; z-index: 3000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: 72px; height: 72px; border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: grid; place-items: center; margin-bottom: 1.25rem;
      box-shadow: 0 12px 32px var(--primary-soft);
    }
    .splash-logo img { width: 40px; height: 40px; }
    .splash-title { font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; }
    .splash-spin {
      width: 36px; height: 36px; margin: 1.25rem auto .75rem;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .splash-status {
      font-size: .88rem; color: var(--text-secondary); text-align: center;
      max-width: 280px; min-height: 2.6em; padding: 0 1rem;
      transition: opacity .25s ease;
    }

    /* File input styled */
    .file-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 40px; cursor: pointer;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-weight: 600; font-size: .88rem;
      transition: border-color .2s, transform .2s;
    }
    .file-btn:hover { border-color: var(--primary); }
    .file-btn input[type=file] { display: none; }
    .file-name { font-size: .8rem; color: var(--text-muted); margin-top: 6px; }

    /* Theme sun/moon */
    .theme-toggle {
      display: inline-flex; gap: 4px; padding: 3px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
    }
    .theme-toggle button {
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: transparent; color: var(--text-secondary); cursor: pointer;
      display: grid; place-items: center;
    }
    .theme-toggle button:hover { color: var(--primary); }
    .theme-toggle button.active {
      background: var(--primary-soft); color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }
    .theme-toggle button svg { display: block; }
    .theme-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    /* Safe areas mobile native */
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .sidebar {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .main {
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
    }
    @media (max-width: 900px) {
      .nav-item { min-height: 44px; font-size: .92rem; }
      .nav-item svg { width: 22px; height: 22px; }
      .topbar h1 { font-size: 1.15rem; }
      .logo-mark, .logo { width: 44px; height: 44px; }
    }

    .overlay-side { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 90; }
    .overlay-side.on { display: block; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .tab {
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); cursor: pointer; font-size: .82rem; font-weight: 600; font-family: inherit;
    }
    .tab.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

    @media (max-width: 1024px) {
      .sidebar { width: 240px; }
      :root, [data-theme="light"], [data-theme="dark"] { --sidebar-w: 240px; }
    }
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        width: min(300px, 88vw);
        box-shadow: 8px 0 32px rgba(0,0,0,.12);
      }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 1rem; padding-bottom: 2.5rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .menu-toggle { display: inline-flex !important; }
      .topbar { gap: 8px; }
      .btn { min-height: 40px; }
      table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: .65rem; }
      .stat-card { padding: .75rem; }
      .stat-card h3 { font-size: 1.05rem; }
      .card { padding: .9rem; border-radius: 14px; }
      .login-card { padding: 1.5rem; border-radius: 22px; }
    }
    @media (max-width: 380px) {
      .stats-grid { grid-template-columns: 1fr; }
      .topbar h1 { font-size: 1rem; }
      table { font-size: .76rem; }
      .nav-item { font-size: .84rem; padding: .7rem .9rem; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo"><img src="/icon.svg" alt="" width="40" height="40" /></div>
    <div class="splash-title">Ábaco<span style="color:var(--primary)">Phy</span></div>
    <div class="splash-spin" aria-hidden="true"></div>
    <p class="splash-status" id="splashStatus">Iniciando sistema contable…</p>
  </div>
  <div id="loginOverlay">
    <div class="login-card">
      <div class="logo-mark"><img src="/icon.svg" alt="" width="28" height="28" /></div>
      <h2>Ábaco<span style="color:var(--primary)">Phy</span></h2>
      <p class="muted">Sistema Contable para Negocios</p>
      <form id="formAcceso">
        <label for="campoUsuario">Usuario</label>
        <input id="campoUsuario" autocomplete="username" required />
        <label for="campoClave">Contraseña</label>
        <input id="campoClave" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <div id="appShell">
    <div class="overlay-side" id="overlaySide"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-row">
          <div class="logo-mark" style="width:40px;height:40px;border-radius:12px"><img src="/icon.svg" width="22" height="22" alt="" /></div>
          <div>
            <h3 id="sideTitle">ÁbacoPhy</h3>
            <p id="sideSub">Negocio</p>
          </div>
        </div>
        <p class="muted" style="margin-top:8px;font-size:.75rem" id="sideUser"></p>
      </div>
      <nav class="nav" id="sideNav"></nav>
    </aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button type="button" class="menu-toggle" id="btnMenu" aria-label="Menú">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 id="pageTitle">Inicio</h1>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge" id="estadoRed">En línea</span>
          <div class="theme-toggle" role="group" aria-label="Tema claro u oscuro">
            <button type="button" id="btnThemeLight" class="active" title="Tema claro" aria-label="Tema claro">
              <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
            <button type="button" id="btnThemeDark" title="Tema oscuro" aria-label="Tema oscuro">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="btnSalir">Salir</button>
        </div>
      </div>
      <div id="principal"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

<script>
/* Red de seguridad temprana: si el resto del script falla, el splash no se queda eterno */
(function () {
  function forceOutOfSplash() {
    try {
      var sp = document.getElementById('splash');
      if (sp) { sp.classList.add('hide'); sp.style.display = 'none'; }
      var lo = document.getElementById('loginOverlay');
      if (lo) lo.style.display = 'flex';
    } catch (e) {}
  }
  setTimeout(forceOutOfSplash, 5000);
  window.__abacoForceLogin = forceOutOfSplash;
})();

const API = (function(){
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1') return location.origin + '/api/v1';
  if (h.includes('abacophy')) return location.origin + '/api/v1';
  return 'https://abacophy.onrender.com/api/v1';
})();

const ICONS = {
  inicio: '<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  ingresos: '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg>',
  gastos: '<svg viewBox="0 0 24 24"><path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M5 3h14"/></svg>',
  inventario: '<svg viewBox="0 0 24 24"><path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l2-3h14l2 3"/></svg>',
  facturas: '<svg viewBox="0 0 24 24"><path d="M7 3h10v18l-2-1-2 1-2-1-2 1-2-1-2 1V3z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  nomina: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  cuentas: '<svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 10h16v10H4z"/><path d="M8 14h2m4 0h2"/></svg>',
  monedas: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10m-3-7.5c0-1 1.5-1.5 3-1.5s3 .5 3 1.5-1.5 1.5-3 1.5-3 .5-3 1.5 1.5 1.5 3 1.5 3-.5 3-1.5"/></svg>',
  informes: '<svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16"/><path d="M8 17V10m4 7V7m4 10v-4"/></svg>',
  traza: '<svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
  productos: '<svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M8 7V5h8v2"/></svg>',
  almacen: '<svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-8h6v8"/></svg>',
  unidades: '<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M3 21v-2a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v2M13 21v-2a4 4 0 0 1 4-4h0a4 4 0 0 1 4 4v2"/></svg>',
  recepcion: '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg>',
  vendedor: '<svg viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 7h14m-9-7v7m5-7v7"/></svg>',
  fichas: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  salvas: '<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h9l5 5v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 5v5h5M8 17h8"/></svg>',
  negocio: '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg>',
  master: '<svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V7l-8-4z"/></svg>',
  tema: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>',
};

function safeJSON(raw, fallback) {
  try { return JSON.parse(raw); } catch (_) { return fallback; }
}
const state = {
  token: localStorage.getItem('ap_token') || '',
  user: null, tenant: null, views: [], modules: {}, tab: 'inicio', nomTab: 'productos',
  informeSub: 'situacion',
  nomSub: 'productos',
  queue: safeJSON(localStorage.getItem('ap_queue') || '[]', []),
  cache: safeJSON(localStorage.getItem('ap_cache') || '{}', {}),
  themeMode: localStorage.getItem('ap_theme') || 'light',
};
if (!Array.isArray(state.queue)) state.queue = [];
if (!state.cache || typeof state.cache !== 'object') state.cache = {};

function applyThemeMode(mode) {
  state.themeMode = mode || 'light';
  document.documentElement.setAttribute('data-theme', state.themeMode);
  localStorage.setItem('ap_theme', state.themeMode);
  const bl = document.getElementById('btnThemeLight');
  const bd = document.getElementById('btnThemeDark');
  if (bl && bd) {
    bl.classList.toggle('active', state.themeMode === 'light');
    bd.classList.toggle('active', state.themeMode === 'dark');
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = state.themeMode === 'dark' ? '#0A0A0A' : '#F4B400';
}
applyThemeMode(state.themeMode);

function statusES(s) {
  return ({ draft: 'Borrador', issued: 'Emitida', paid: 'Pagada', void: 'Anulada', cancelled: 'Anulada' })[s] || s || '—';
}
function money(n, cur) {
  const c = cur || (state.tenant && state.tenant.currency) || 'CUP';
  return `${(Number(n)||0).toFixed(2)} ${c}`;
}
async function reportSystemError(detail, ref) {
  try {
    if (!state.token) return;
    await fetch(API + '/errors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.token },
      body: JSON.stringify({ detail: detail, ref: ref || '' }),
    });
  } catch (_) {}
}
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg; el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2800);
}
function setRed(ok, text) {
  const b = document.getElementById('estadoRed');
  if (!b) return;
  if (text) { b.textContent = text; b.className = 'badge syncing'; return; }
  b.textContent = ok ? 'En línea' : 'Sin conexión';
  b.className = 'badge' + (ok ? ' ok' : ' off');
}
function saveLocal() {
  localStorage.setItem('ap_token', state.token || '');
  localStorage.setItem('ap_queue', JSON.stringify(state.queue));
  localStorage.setItem('ap_cache', JSON.stringify(state.cache));
}
async function api(path, opts={}) {
  const headers = Object.assign({}, opts.headers || {});
  if (!(opts.body instanceof FormData)) headers['Content-Type'] = headers['Content-Type'] || 'application/json';
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  const ctrl = new AbortController();
  const ms = opts.timeoutMs || 12000;
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(API + path, {...opts, headers, signal: ctrl.signal});
    setRed(true);
    if (path.includes('/pdf') || path.includes('/export') || path.includes('/payroll/pdf')) return res;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      let errMsg = data.error || res.statusText || 'error HTTP';
      if (res.status === 401) errMsg = 'unauthorized';
      if (res.status === 403) errMsg = errMsg || 'forbidden';
      if (!path.includes('/auth/') && path !== '/errors' && res.status !== 401) {
        try { reportSystemError('Error de API · ' + path + ' · ' + errMsg, path); } catch(_) {}
      }
      throw new Error(errMsg);
    }
    return data;
  } catch (e) {
    setRed(false);
    if (e && e.name === 'AbortError') throw new Error('Tiempo de espera agotado');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}
async function notifySync(status, detail) {
  try {
    await api('/sync/notify', { method: 'POST', body: JSON.stringify({ status, detail }) });
  } catch (_) {}
}
async function autoSync() {
  if (!state.token || !state.queue.length) return;
  if (!navigator.onLine) return;
  setRed(true, 'Sincronizando…');
  await notifySync('started', 'Sincronización automática iniciada · '+state.queue.length+' operaciones en cola · '+new Date().toISOString());
  try {
    await api('/sync/push', { method: 'POST', body: JSON.stringify({
      entries: state.queue.filter(x => x.kind === 'entry').map(x => x.payload),
      invoices: state.queue.filter(x => x.kind === 'invoice').map(x => x.payload),
      inventory: state.queue.filter(x => x.kind === 'inventory').map(x => x.payload),
      client_rev: state.cache.rev || 0,
    })});
    const n = state.queue.length;
    state.queue = []; saveLocal();
    await notifySync('ok', 'Sincronización automática completada · '+n+' operaciones enviadas · '+new Date().toISOString());
    setRed(true); toast('Sincronización completada');
  } catch (e) {
    await notifySync('error', 'Error en sincronización automática: '+(e.message||'desconocido')+' · '+new Date().toISOString());
    setRed(false); toast('Sync pendiente');
  }
}
window.addEventListener('online', () => { setRed(true); autoSync(); });
window.addEventListener('offline', () => setRed(false));
setInterval(() => { if (navigator.onLine && state.queue.length) autoSync(); }, 45000);

(function bindChrome() {
  const form = document.getElementById('formAcceso');
  if (form) form.onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      const data = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          username: document.getElementById('campoUsuario').value.trim(),
          password: document.getElementById('campoClave').value,
        }),
      });
      state.token = data.token; state.user = data.user; state.views = data.views || []; state.modules = data.modules || {};
      const clave = document.getElementById('campoClave');
      if (clave) clave.value = '';
      saveLocal();
      await boot();
      hideSplash();
    } catch (e) { toast(e.message || 'No se pudo iniciar sesión'); }
  };
  const btnSalir = document.getElementById('btnSalir');
  if (btnSalir) btnSalir.onclick = async () => {
    try { await api('/auth/logout', { method: 'POST' }); } catch (_) {}
    state.token = ''; saveLocal(); location.reload();
  };
  const btnMenu = document.getElementById('btnMenu');
  if (btnMenu) btnMenu.onclick = () => {
    document.getElementById('sidebar')?.classList.toggle('open');
    document.getElementById('overlaySide')?.classList.toggle('on');
  };
  const ov = document.getElementById('overlaySide');
  if (ov) ov.onclick = () => {
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('overlaySide')?.classList.remove('on');
  };
})();

function can(view) {
  if (!state.views || !state.views.length) return false;
  if (!state.views.includes(view)) return false;
  const mods = state.modules || {};
  if (Object.keys(mods).length && mods[view] === false) return false;
  return true;
}
function renderNav() {
  const nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  NAV.filter(n => {
    if (n.id === 'tema' || n.id === 'master') return state.user && state.user.role === 'master';
    return can(n.view);
  }).forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'nav-item' + (state.tab === n.id ? ' active' : '');
    b.innerHTML = (ICONS[n.icon] || '') + '<span>' + n.label + '</span>';
    b.onclick = () => {
      state.tab = n.id;
      document.getElementById('pageTitle').textContent = n.label;
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlaySide').classList.remove('on');
      renderNav(); render();
    };
    nav.appendChild(b);
  });
}
async function loadMe() {
  const me = await api('/auth/me');
  state.user = me.user; state.tenant = me.tenant; state.views = me.views || state.views; state.modules = me.modules || state.modules || {};
  state.cache.rev = me.rev; state.cache.root_cid = me.root_cid;
  document.getElementById('sideTitle').textContent = (me.tenant.settings && me.tenant.settings.app_title) || me.tenant.name || 'ÁbacoPhy';
  document.getElementById('sideSub').textContent = me.tenant.name || 'Negocio';
  const rol = { master: 'Master', admin: 'Administrador', contador: 'Contador', economico: 'Económico', vendedor: 'Vendedor', almacenero: 'Almacenero', operador: 'Operador', readonly: 'Solo lectura' }[me.user.role] || me.user.role;
  document.getElementById('sideUser').textContent = (me.user.display_name || me.user.username) + ' · ' + rol;
  saveLocal();
}

      main.innerHTML = `<div class="card"><div class="section-label">Apariencia (solo master)</div>
        <label>Título de la app</label><input id="apptitle" value="${s.app_title || 'ÁbacoPhy'}" />
        <label>Nombre del negocio por defecto</label><input id="thname" value="${th.name || ''}" />
        <label>Color primario</label><input id="thpri" type="color" value="${s.primary || '#C9920A'}" />
        <label>Color primario oscuro</label><input id="thprid" type="color" value="${s.primary_dark || '#A67A08'}" />
        <button class="btn btn-primary" id="saveTh">Aplicar</button>
      </div>`;
      document.getElementById('saveTh').onclick = async () => {
        await api('/theme', { method: 'PUT', body: JSON.stringify({
          app_title: document.getElementById('apptitle').value.trim(),
          name: document.getElementById('thname').value.trim(),
          primary: document.getElementById('thpri').value.trim(),
          primary_dark: document.getElementById('thprid').value.trim(),
        })});
        toast('Apariencia actualizada'); await loadMe(); renderNav();
      };
    
    } else if (state.tab === 'fichas_precio') {
      const sheets = await api('/price-sheets');
      const prods = await api('/products');
      const popts = (prods.products||[]).map(p=>`<option value="${p.id}">${p.code} — ${p.name}</option>`).join('');
      const rows = (sheets.sheets||[]).map(s => `<tr>
        <td>${s.product_code}</td><td>${s.product_name}</td>
        <td class="money">${money(s.cost_ref, s.currency)}</td>
        <td>${s.margin_pct}%</td>
        <td class="money">${money(s.price, s.currency)}</td>
        <td><button class="btn btn-ghost btn-sm" data-psd="${s.id}">Eliminar</button></td>
      </tr>`).join('');
      main.innerHTML = `<div class="card"><div class="section-label">Fichas de precio</div>
        <p class="muted">Distinto de la ficha de costo: aquí define precio de venta y margen. El costo de producción se calcula en Fichas de costo.</p>
        <label>Producto</label><select id="psP">${popts}</select>
        <label>Costo referencia</label><input id="psC" type="number" step="0.01"/>
        <label>Margen %</label><input id="psM" type="number" step="0.1" value="20"/>
        <label>Precio venta (opcional; si vacío se calcula)</label><input id="psPr" type="number" step="0.01"/>
        <button class="btn btn-primary" id="addPS">Registrar ficha de precio</button></div>
        <div class="card"><table><thead><tr><th>Código</th><th>Producto</th><th>Costo ref.</th><th>Margen</th><th>Precio</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="6" class="muted">Sin fichas de precio</td></tr>'}</tbody></table></div>`;
      document.getElementById('addPS').onclick = async () => {
        await api('/price-sheets', { method:'POST', body: JSON.stringify({
          product_id: document.getElementById('psP').value,
          cost_ref: +document.getElementById('psC').value||0,
          margin_pct: +document.getElementById('psM').value||0,
          price: +document.getElementById('psPr').value||0,
        })});
        toast('Ficha de precio creada'); render();
      };
      main.querySelectorAll('[data-psd]').forEach(b => b.onclick = async () => {
        await api('/price-sheets?id='+b.getAttribute('data-psd'), { method:'DELETE' });
        toast('Eliminada'); render();
      });
    } else if (state.tab === 'pedidos') {
      const data = await api('/online-orders');
      const prods = await api('/products');
      const popts = (prods.products||[]).map(p=>`<option value="${p.id}">${p.code} — ${p.name}</option>`).join('');
      const stLabel = {pending:'Pendiente', confirmed:'Confirmado', cancelled:'Cancelado', delivered:'Entregado'};
      const rows = (data.orders||[]).slice().reverse().map(o => `<tr>
        <td>${o.number}</td><td>${o.customer}</td><td>${o.phone||''}</td>
        <td class="money">${money(o.total, o.currency)}</td>
        <td>${stLabel[o.status]||o.status}</td>
        <td>
          <button class="btn btn-ghost btn-sm" data-oc="${o.id}">Confirmar</button>
          <button class="btn btn-ghost btn-sm" data-ox="${o.id}">Cancelar</button>
        </td>
      </tr>`).join('');
      main.innerHTML = `<div class="card"><div class="section-label">Pedidos online</div>
        <p class="muted">Módulo tipo La Tati: el cliente pide y usted confirma. Active o desactive este módulo desde Master.</p>
        <label>Cliente</label><input id="ocN"/>
        <label>Teléfono</label><input id="ocT"/>
        <label>Producto</label><select id="ocP">${popts}</select>
        <label>Cantidad</label><input id="ocQ" type="number" value="1" min="1"/>
        <button class="btn btn-primary" id="addO">Registrar pedido</button></div>
        <div class="card"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Tel.</th><th>Total</th><th>Estado</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="6" class="muted">Sin pedidos</td></tr>'}</tbody></table></div>`;
      document.getElementById('addO').onclick = async () => {
        await api('/online-orders', { method:'POST', body: JSON.stringify({
          customer: document.getElementById('ocN').value.trim(),
          phone: document.getElementById('ocT').value.trim(),
          lines: [{ product_id: document.getElementById('ocP').value, qty: +document.getElementById('ocQ').value||1 }],
        })});
        toast('Pedido registrado'); render();
      };
      main.querySelectorAll('[data-oc]').forEach(b => b.onclick = async () => {
        await api('/online-orders', { method:'PUT', body: JSON.stringify({ id: b.getAttribute('data-oc'), status: 'confirmed' })});
        toast('Confirmado'); render();
      });
      main.querySelectorAll('[data-ox]').forEach(b => b.onclick = async () => {
        await api('/online-orders', { method:'PUT', body: JSON.stringify({ id: b.getAttribute('data-ox'), status: 'cancelled' })});
        toast('Cancelado'); render();
      });
    } else if (state.tab === 'tienda') {
      const prods = await api('/products');
      const cards = (prods.products||[]).filter(p=>p.active!==false).map(p => `
        <div class="card" style="margin:0">
          <div class="section-label">${p.name}</div>
          <p class="muted">${p.code} · ${p.unit||''}</p>
          <p class="money" style="font-size:1.2rem">${money(p.price_sale||0, state.tenant?.currency||'CUP')}</p>
        </div>`).join('');
      main.innerHTML = `<div class="card"><div class="section-label">Tienda / catálogo público</div>
        <p class="muted">Vista de catálogo para compartir con clientes (similar a La Tati). Los pedidos se gestionan en Pedidos online.</p></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">${cards||'<p class="muted">Sin productos</p>'}</div>`;

    } else if (state.tab === 'master' && state.user && state.user.role === 'master') {
      const tenants = await api('/master/tenants');
      let errs = { errors: [] };
      try { errs = await api('/errors'); } catch (_) {}
      let modData = { modules: {}, catalog: [] };
      try { modData = await api('/modules'); } catch (_) {}
      const modRows = (modData.catalog || []).map(m => {
        const on = modData.modules && modData.modules[m.id] !== false;
        const dis = m.core ? 'disabled' : '';
        return `<tr>
          <td>${m.name}</td><td class="muted">${m.description||''}</td>
          <td>${m.core ? 'Núcleo' : (m.group||'')}</td>
          <td><label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" data-mod="${m.id}" ${on?'checked':''} ${dis}/>
            ${m.core ? 'siempre' : (on?'activo':'off')}
          </label></td>
        </tr>`;
      }).join('');
      main.innerHTML = `<div class="card"><div class="section-label">Módulos del negocio</div>
        <p class="muted" style="margin-bottom:.75rem">Active o desactive módulos según lo que necesite el negocio. Los de núcleo no se pueden apagar. Los cambios aplican al menú y a la API (roles siguen limitando el acceso).</p>
        <table><thead><tr><th>Módulo</th><th>Descripción</th><th>Grupo</th><th>Estado</th></tr></thead>
        <tbody id="modList">${modRows||'<tr><td colspan="4" class="muted">—</td></tr>'}</tbody></table>
        <button class="btn btn-primary" id="btnSaveMods" style="margin-top:12px">Guardar módulos</button>
      </div>
      <div class="card"><div class="section-label">Master · negocios</div>
        <p class="muted" style="margin-bottom:.5rem">Vista de tenants de la instancia. Transparente para el usuario final del negocio.</p>
        <pre class="muted" style="white-space:pre-wrap;font-size:.8rem">${JSON.stringify(tenants.tenants, null, 2)}</pre>
      </div>
      <div class="card"><div class="section-label">Errores registrados por el sistema</div>
        <p class="muted" style="margin-bottom:.75rem">El sistema documenta de forma autónoma fallos de API, sincronización y operaciones. También se reflejan en la traza.</p>
        <table><thead><tr><th>Fecha</th><th>Detalle</th></tr></thead>
        <tbody>${(errs.errors || []).map(e => `<tr><td>${(e.created_at || '').toString().slice(0, 19).replace('T',' ')}</td><td>${e.detail || e.action || ''}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Sin errores capturados aún</td></tr>'}</tbody></table>
      </div>
      <div class="card"><div class="section-label">Restaurar aplicación</div>
        <p class="muted" style="margin-bottom:.75rem">Reinicia la instancia a estado inicial (cero datos de negocio). Las claves master/admin vuelven a las documentadas en LOGIN.md.</p>
        <button class="btn btn-danger" id="btnFactoryReset">Restaurar a estado inicial</button>
      </div>`;
      const btnMods = document.getElementById('btnSaveMods');
      if (btnMods) btnMods.onclick = async () => {
        const modules = {};
        main.querySelectorAll('[data-mod]').forEach(cb => {
          modules[cb.getAttribute('data-mod')] = !!cb.checked;
        });
        await api('/modules', { method: 'PUT', body: JSON.stringify({ modules }) });
        toast('Módulos actualizados');
        await loadMe();
        renderNav();
        render();
      };
      document.getElementById('btnFactoryReset').onclick = async () => {
        if (!confirm('¿Restaurar la aplicación a cero datos? Se perderán todos los negocios y operaciones de esta instancia.')) return;
        const conf = prompt('Escriba REINICIAR para confirmar');
        if (conf !== 'REINICIAR') { toast('Cancelado'); return; }
        await api('/master/reset', { method: 'POST', body: JSON.stringify({ confirm: 'REINICIAR' }) });
        state.token = ''; saveLocal();
        toast('Instancia reiniciada · inicie sesión de nuevo');
        location.reload();
      };
    }
  } catch (e) {
    main.innerHTML = `<div class="card muted">No se pudo cargar (${e.message})</div>`;
  }
}

function setSplash(msg) {
  const el = document.getElementById('splashStatus');
  if (el) { el.style.opacity = '0'; setTimeout(() => { el.textContent = msg; el.style.opacity = '1'; }, 180); }
}
function hideSplash() {
  const sp = document.getElementById('splash');
  if (!sp) return;
  sp.classList.add('hide');
  setTimeout(() => { sp.style.display = 'none'; }, 400);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function boot() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appShell').classList.add('on');
  await loadMe();
  renderNav();
  applyThemeMode(state.themeMode);
  await render();
  autoSync();
}

async function startApp() {
  applyThemeMode(state.themeMode);
  const bl = document.getElementById('btnThemeLight');
  const bd = document.getElementById('btnThemeDark');
  if (bl) bl.onclick = () => { applyThemeMode('light'); toast('Tema claro'); };
  if (bd) bd.onclick = () => { applyThemeMode('dark'); toast('Tema oscuro'); };

  setSplash('Comprobando sesión…');
  await sleep(400);

  if (state.token) {
    setSplash('Restaurando sesión…');
    try {
      await boot();
      setSplash('Listo');
      await sleep(200);
      hideSplash();
      return;
    } catch (err) {
      const msg = (err && err.message) ? String(err.message) : '';
      const unauthorized = /unauthor|401|inválid|incorrect|forbidden|tenant not found/i.test(msg);
      console.warn('[ÁbacoPhy] restaurar sesión', msg);
      if (unauthorized) {
        state.token = '';
        state.user = null;
        saveLocal();
        setSplash('Sesión no válida · acceso…');
        await sleep(350);
      } else {
        // Red caída o servidor reiniciando: mantener token y reintentar
        setSplash('Sin respuesta del servidor · reintentando…');
        await sleep(800);
        try {
          await boot();
          hideSplash();
          return;
        } catch (err2) {
          const m2 = (err2 && err2.message) ? String(err2.message) : '';
          if (/unauthor|401|inválid|incorrect|forbidden|tenant not found/i.test(m2)) {
            state.token = ''; state.user = null; saveLocal();
          } else {
            // Seguir con shell; el usuario puede reintentar sin perder token
            hideSplash();
            document.getElementById('appShell')?.classList.add('on');
            document.getElementById('loginOverlay').style.display = 'none';
            const main = document.getElementById('main');
            if (main) main.innerHTML = `<div class="card"><div class="section-label">Sin conexión con el servidor</div>
              <p class="muted">La sesión se conserva. Compruebe que ÁbacoPhy esté en marcha y pulse reintentar.</p>
              <button class="btn btn-primary" id="btnRetryBoot">Reintentar</button>
              <button class="btn btn-ghost" id="btnForceLogin">Ir al acceso</button></div>`;
            document.getElementById('btnRetryBoot').onclick = () => location.reload();
            document.getElementById('btnForceLogin').onclick = () => {
              state.token = ''; state.user = null; saveLocal(); location.reload();
            };
            return;
          }
        }
      }
    }
  } else {
    setSplash('Preparando acceso…');
    await sleep(300);
  }
  hideSplash();
  const lo = document.getElementById('loginOverlay');
  if (lo) lo.style.display = 'flex';
  const sh = document.getElementById('appShell');
  if (sh) sh.classList.remove('on');
}

if ('serviceWorker' in navigator) {
  // En local: actualizar SW en cada carga para no quedarse con HTML viejo
  navigator.serviceWorker.register('/sw.js').then((reg) => {
    reg.update().catch(() => {});
    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // Una sola recarga controlada tras actualizar SW (evita bucle)
      if (!sessionStorage.getItem('ap_sw_reloaded')) {
        sessionStorage.setItem('ap_sw_reloaded', '1');
        location.reload();
      }
    });
  }).catch(() => {});
  // Limpiar bandera tras unos segundos (permite futuras actualizaciones)
  setTimeout(() => sessionStorage.removeItem('ap_sw_reloaded'), 5000);
}
startApp().catch((err) => {
  console.error('[ÁbacoPhy] startApp fatal', err);
  if (window.__abacoForceLogin) window.__abacoForceLogin();
});
</script>
</body>
</html>
