<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4b400" />
  <title>ÁbacoPhy</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #F4B400;
      --primary-dark: #FB8C00;
      --bg-primary: #0A0A0A;
      --bg-secondary: #0F0F0F;
      --bg-card: #141414;
      --bg-elevated: #1A1A1A;
      --text-primary: #FFFFFF;
      --text-secondary: #B0B0B0;
      --text-muted: #6B6B6B;
      --accent-green: #4CAF50;
      --accent-red: #FF5252;
      --border: rgba(244, 180, 0, 0.15);
      --shadow: 0 8px 32px rgba(0,0,0,.4);
      --sidebar-w: 260px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(ellipse at 20% 30%, #0F0F0F, #050505);
      color: var(--text-primary);
      min-height: 100dvh;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .hidden { display: none !important; }

    /* Login */
    #loginOverlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #121212, #050505);
      padding: 20px;
    }
    .login-card {
      width: 100%; max-width: 420px;
      background: rgba(20,20,20,.92); backdrop-filter: blur(16px);
      border: 1px solid rgba(244,180,0,.2); border-radius: 28px;
      padding: 2.25rem; text-align: center;
      box-shadow: var(--shadow); animation: fadeInUp .5s ease;
    }
    .login-card h2 { font-weight: 800; letter-spacing: -.02em; margin: .75rem 0 .35rem; }
    .login-card .muted { color: var(--text-secondary); font-size: .9rem; margin-bottom: 1.5rem; }

    /* Shell */
    #appShell { display: none; min-height: 100dvh; }
    #appShell.on { display: block; }

    .sidebar {
      width: var(--sidebar-w); position: fixed; inset: 0 auto 0 0;
      background: rgba(15,15,15,.96); backdrop-filter: blur(12px);
      border-right: 1px solid rgba(244,180,0,.1);
      overflow-y: auto; z-index: 100; display: flex; flex-direction: column;
      transition: transform .25s ease;
    }
    .sidebar-header { padding: 1.5rem 1.25rem; border-bottom: 1px solid rgba(244,180,0,.12); }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: grid; place-items: center; color: #0A0A0A;
      box-shadow: 0 4px 16px rgba(244,180,0,.3);
    }
    .logo svg { width: 22px; height: 22px; stroke: #0A0A0A; fill: none; stroke-width: 1.8; }
    .brand-row h3 { font-size: 1rem; font-weight: 800; }
    .brand-row p { font-size: .65rem; color: var(--text-muted); }

    .nav { padding: .75rem 0 1.5rem; flex: 1; }
    .nav-item {
      margin: .2rem .65rem; padding: .75rem 1rem; border-radius: 12px;
      display: flex; align-items: center; gap: 12px;
      color: var(--text-secondary); font-weight: 500; font-size: .9rem;
      cursor: pointer; transition: all .25s ease; border: none; background: transparent;
      width: calc(100% - 1.3rem); text-align: left; font-family: inherit;
    }
    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; flex-shrink: 0; }
    .nav-item:hover { background: rgba(244,180,0,.1); color: var(--primary); transform: translateX(4px); }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(244,180,0,.15), rgba(251,140,0,.08));
      color: var(--primary); border-left: 3px solid var(--primary);
    }

    .main { margin-left: var(--sidebar-w); padding: 1.5rem; min-height: 100dvh; animation: fadeInUp .4s ease; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
    .badge {
      font-size: .65rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(244,180,0,.12); color: var(--primary); border: 1px solid var(--border);
    }
    .badge.off { background: rgba(255,82,82,.12); color: var(--accent-red); border-color: rgba(255,82,82,.3); }

    .card {
      background: rgba(20,20,20,.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(244,180,0,.1); border-radius: 20px;
      padding: 1.25rem; margin-bottom: 1rem;
      transition: transform .25s ease, border-color .25s;
      animation: fadeInUp .35s ease;
    }
    .card:hover { border-color: rgba(244,180,0,.28); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem; margin-bottom: 1rem;
    }
    .stat-card {
      background: rgba(20,20,20,.7); border: 1px solid rgba(244,180,0,.1);
      border-radius: 18px; padding: 1.15rem; text-align: center;
      transition: transform .25s ease, border-color .25s;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .stat-card svg { width: 28px; height: 28px; stroke: var(--primary); fill: none; stroke-width: 1.6; margin-bottom: .5rem; }
    .stat-card h3 { font-size: 1.45rem; font-weight: 800; color: var(--primary); }
    .stat-card small { color: var(--text-muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }

    label {
      display: block; font-size: .68rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 12px 14px; margin-bottom: .85rem;
      background: rgba(26,26,26,.85); border: 1px solid rgba(244,180,0,.15);
      border-radius: 12px; color: var(--text-primary); font-family: inherit; font-size: .95rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn {
      padding: 11px 20px; border-radius: 40px; border: none; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      font-family: inherit; font-size: .9rem; transition: all .25s ease;
    }
    .btn-primary { background: linear-gradient(135deg, #F4B400, #FB8C00); color: #0A0A0A; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(244,180,0,.3); }
    .btn-secondary { background: rgba(26,26,26,.9); color: var(--text-primary); border: 1px solid rgba(244,180,0,.2); }
    .btn-secondary:hover { border-color: var(--primary); }
    .btn-sm { padding: 6px 12px; font-size: .75rem; border-radius: 20px; }
    .btn-danger { background: linear-gradient(135deg, #FF5252, #D32F2F); color: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 700px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 1rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .menu-toggle { display: inline-flex !important; }
    }
    .menu-toggle {
      display: none; background: transparent; border: 1px solid var(--border);
      border-radius: 10px; padding: 8px; color: var(--primary); cursor: pointer;
    }
    .menu-toggle svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,.06); }
    th { color: var(--text-muted); font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; }

    .section-label { font-size: .65rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }
    .muted { color: var(--text-secondary); font-size: .88rem; }
    .money { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--primary); }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20,20,20,.95); border: 1px solid var(--border);
      padding: 12px 18px; border-radius: 14px; z-index: 2000; max-width: 92vw;
      animation: fadeInUp .3s ease;
    }
    .eq { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--text-secondary); }
    .overlay-side {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 90;
    }
    .overlay-side.on { display: block; }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-card">
      <div class="logo" style="margin:0 auto">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h2>Ábaco<span style="color:var(--primary)">Phy</span></h2>
      <p class="muted">Contabilidad para PyME · PrismaTEC</p>
      <form id="formAcceso">
        <label for="campoUsuario">Usuario</label>
        <input id="campoUsuario" autocomplete="username" required />
        <label for="campoClave">Contraseña</label>
        <input id="campoClave" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <div id="appShell">
    <div class="overlay-side" id="overlaySide"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-row">
          <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
          <div>
            <h3 id="sideTitle">ÁbacoPhy</h3>
            <p id="sideSub">Contabilidad</p>
          </div>
        </div>
        <p class="muted" style="margin-top:10px;font-size:.75rem" id="sideUser"></p>
      </div>
      <nav class="nav" id="sideNav"></nav>
    </aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button type="button" class="menu-toggle" id="btnMenu" aria-label="Menú">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 id="pageTitle">Inicio</h1>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge" id="estadoRed">En línea</span>
          <button type="button" class="btn btn-secondary btn-sm" id="btnSync">Sincronizar</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnSalir">Salir</button>
        </div>
      </div>
      <div id="principal"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

<script>
const API = (function(){
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1') return location.origin + '/api/v1';
  if (h.includes('abacophy')) return location.origin + '/api/v1';
  return 'https://abacophy.onrender.com/api/v1';
})();

const ICONS = {
  inicio: '<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  ingresos: '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg>',
  gastos: '<svg viewBox="0 0 24 24"><path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M5 3h14"/></svg>',
  inventario: '<svg viewBox="0 0 24 24"><path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l2-3h14l2 3"/></svg>',
  facturas: '<svg viewBox="0 0 24 24"><path d="M7 3h10v18l-2-1-2 1-2-1-2 1-2-1-2 1V3z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  nomina: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  cuentas: '<svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 10h16v10H4z"/><path d="M8 14h2m4 0h2"/></svg>',
  cuentas_t: '<svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 17h14"/></svg>',
  monedas: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10m-3-7.5c0-1 1.5-1.5 3-1.5s3 .5 3 1.5-1.5 1.5-3 1.5-3 .5-3 1.5 1.5 1.5 3 1.5 3-.5 3-1.5"/></svg>',
  reportes: '<svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16"/><path d="M8 17V10m4 7V7m4 10v-4"/></svg>',
  traza: '<svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
  salvas: '<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h9l5 5v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 5v5h5M8 17h8"/></svg>',
  negocio: '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg>',
  master: '<svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V7l-8-4z"/></svg>',
  tema: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>',
};

const NAV = [
  { id: 'inicio', label: 'Inicio', view: 'dashboard', icon: 'inicio' },
  { id: 'ingresos', label: 'Ingresos', view: 'ingresos', icon: 'ingresos' },
  { id: 'gastos', label: 'Gastos', view: 'gastos', icon: 'gastos' },
  { id: 'inventario', label: 'Inventario', view: 'inventario', icon: 'inventario' },
  { id: 'facturas', label: 'Facturas', view: 'facturas', icon: 'facturas' },
  { id: 'nomina', label: 'Nómina', view: 'nomina', icon: 'nomina' },
  { id: 'cuentas', label: 'Cuentas', view: 'cuentas', icon: 'cuentas' },
  { id: 'cuentas_t', label: 'Cuenta T', view: 'cuentas_t', icon: 'cuentas_t' },
  { id: 'monedas', label: 'Monedas', view: 'monedas', icon: 'monedas' },
  { id: 'reportes', label: 'Estados', view: 'reportes', icon: 'reportes' },
  { id: 'traza', label: 'Traza', view: 'traza', icon: 'traza' },
  { id: 'salvas', label: 'Salvas CID', view: 'salvas', icon: 'salvas' },
  { id: 'negocio', label: 'Negocio', view: 'tenant', icon: 'negocio' },
  { id: 'tema', label: 'Apariencia', view: 'master', icon: 'tema' },
  { id: 'master', label: 'Master', view: 'master', icon: 'master' },
];

const state = {
  token: localStorage.getItem('ap_token') || '',
  user: null, tenant: null, views: [], tab: 'inicio',
  queue: JSON.parse(localStorage.getItem('ap_queue') || '[]'),
  cache: JSON.parse(localStorage.getItem('ap_cache') || '{}'),
  theme: {},
};

function money(n, cur) {
  const c = cur || (state.tenant && state.tenant.currency) || 'CUP';
  return `${(Number(n)||0).toFixed(2)} ${c}`;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2800);
}
function setRed(ok) {
  const b = document.getElementById('estadoRed');
  b.textContent = ok ? 'En línea' : 'Sin conexión';
  b.className = 'badge' + (ok ? '' : ' off');
}
function saveLocal() {
  localStorage.setItem('ap_token', state.token || '');
  localStorage.setItem('ap_queue', JSON.stringify(state.queue));
  localStorage.setItem('ap_cache', JSON.stringify(state.cache));
}
async function api(path, opts={}) {
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  try {
    const res = await fetch(API + path, {...opts, headers});
    setRed(true);
    if (path.includes('/invoices/pdf')) return res;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  } catch (e) { setRed(false); throw e; }
}
function applyTheme(settings) {
  if (!settings) return;
  state.theme = settings;
  if (settings.primary) document.documentElement.style.setProperty('--primary', settings.primary);
  if (settings.primary_dark) document.documentElement.style.setProperty('--primary-dark', settings.primary_dark);
  if (settings.bg) {
    document.documentElement.style.setProperty('--bg-primary', settings.bg);
    document.body.style.background = settings.bg;
  }
  if (settings.text) document.documentElement.style.setProperty('--text-primary', settings.text);
  if (settings.card) document.documentElement.style.setProperty('--bg-card', settings.card);
  if (settings.app_title) {
    document.getElementById('sideTitle').textContent = settings.app_title;
    document.title = settings.app_title;
  }
}

document.getElementById('formAcceso').onsubmit = async (ev) => {
  ev.preventDefault();
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        username: document.getElementById('campoUsuario').value.trim(),
        password: document.getElementById('campoClave').value,
      }),
    });
    state.token = data.token;
    state.user = data.user;
    state.views = data.views || [];
    document.getElementById('campoClave').value = '';
    saveLocal();
    await boot();
  } catch (e) { toast(e.message || 'No se pudo iniciar sesión'); }
};

document.getElementById('btnSalir').onclick = async () => {
  try { await api('/auth/logout', {method:'POST'}); } catch(_){}
  state.token = ''; saveLocal(); location.reload();
};
document.getElementById('btnSync').onclick = async () => {
  if (!state.queue.length) { toast('Nada pendiente'); return; }
  try {
    await api('/sync/push', { method:'POST', body: JSON.stringify({
      entries: state.queue.filter(x=>x.kind==='entry').map(x=>x.payload),
      invoices: state.queue.filter(x=>x.kind==='invoice').map(x=>x.payload),
      inventory: state.queue.filter(x=>x.kind==='inventory').map(x=>x.payload),
      client_rev: state.cache.rev||0,
    })});
    state.queue = []; saveLocal(); toast('Sincronizado'); render();
  } catch(_) { toast('Sin conexión aún'); }
};
document.getElementById('btnMenu').onclick = () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlaySide').classList.toggle('on');
};
document.getElementById('overlaySide').onclick = () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlaySide').classList.remove('on');
};

function can(view) {
  if (view === 'dashboard') return state.views.includes('dashboard') || state.views.length;
  if (view === 'reportes') return state.views.includes('reportes') || state.views.includes('cuentas');
  return state.views.includes(view);
}

function renderNav() {
  const nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  NAV.filter(n => {
    if (n.id === 'tema' || n.id === 'master') return state.user && state.user.role === 'master';
    return can(n.view);
  }).forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'nav-item' + (state.tab === n.id ? ' active' : '');
    b.innerHTML = (ICONS[n.icon] || '') + '<span>' + n.label + '</span>';
    b.onclick = () => {
      state.tab = n.id;
      document.getElementById('pageTitle').textContent = n.label;
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlaySide').classList.remove('on');
      renderNav(); render();
    };
    nav.appendChild(b);
  });
}

async function loadMe() {
  const me = await api('/auth/me');
  state.user = me.user;
  state.tenant = me.tenant;
  state.views = me.views || state.views;
  state.cache.rev = me.rev;
  state.cache.root_cid = me.root_cid;
  document.getElementById('sideTitle').textContent = (me.tenant.settings && me.tenant.settings.app_title) || me.tenant.name || 'ÁbacoPhy';
  document.getElementById('sideSub').textContent = me.tenant.name || 'Negocio';
  const rol = {master:'Master',admin:'Administrador',contador:'Contador',operador:'Operador',readonly:'Solo lectura'}[me.user.role] || me.user.role;
  document.getElementById('sideUser').textContent = (me.user.display_name || me.user.username) + ' · ' + rol;
  if (me.tenant.settings) applyTheme(me.tenant.settings);
  saveLocal();
}

async function render() {
  const main = document.getElementById('principal');
  main.innerHTML = '<div class="card muted">Cargando…</div>';
  const base = (state.tenant && state.tenant.currency) || 'CUP';
  try {
    if (state.tab === 'inicio') {
      const rep = await api('/reports/summary').catch(()=>null);
      const eq = (rep && rep.ecuacion) || {};
      main.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg><small>Ingresos</small><h3 class="money">${money(rep&&rep.income_total, base)}</h3></div>

  } catch (e) {
    main.innerHTML = `<div class="card muted">No se pudo cargar (${e.message})</div>`;
  }
}

async function boot() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appShell').classList.add('on');
  await loadMe();
  renderNav();
  await render();
}

async function trySession() {
  if (!state.token) return;
  try { await loadMe(); await boot(); } catch(_) { state.token=''; saveLocal(); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
trySession();
</script>
</body>
</html>
