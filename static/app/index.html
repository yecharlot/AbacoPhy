<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4b400" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ÁbacoPhy</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #0f0f0f;
      --panel: #141414;
      --card: #1a1a1a;
      --elevated: #222;
      --text: #ffffff;
      --muted: #b0b0b0;
      --faint: #6b6b6b;
      --accent: #f4b400;
      --accent-dark: #fb8c00;
      --accent-soft: rgba(244, 180, 0, 0.15);
      --ok: #4caf50;
      --danger: #ff5252;
      --border: rgba(244, 180, 0, 0.15);
      --border-soft: rgba(255, 255, 255, 0.08);
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --display: "DM Sans", system-ui, sans-serif;
    }
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap");
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(244, 180, 0, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(91, 141, 239, 0.06), transparent);
    }
    a { color: var(--accent); text-decoration: none; }
    .app { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }
    /* Header estilo marketplace */
    header.top {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 0;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      margin: 0 -16px; padding-left: 16px; padding-right: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #0a0a0a; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem;
      box-shadow: 0 4px 16px rgba(244, 180, 0, 0.35);
    }
    .badge {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); border: 1px solid var(--border);
    }
    .badge.off { background: rgba(255, 82, 82, 0.12); color: var(--danger); border-color: rgba(255, 82, 82, 0.3); }
    button, .btn {
      appearance: none; border: none; border-radius: 12px; padding: 12px 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #0a0a0a; font-weight: 700; cursor: pointer; font-size: 0.95rem;
      font-family: inherit; transition: transform 0.15s ease, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(244, 180, 0, 0.25);
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: scale(0.97); }
    button.ghost, .btn.ghost {
      background: transparent; color: var(--text);
      border: 1px solid var(--border-soft); box-shadow: none;
    }
    button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    input, select, textarea {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      border: 1px solid var(--border-soft); background: var(--card);
      color: var(--text); font-size: 0.95rem; font-family: inherit;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(244, 180, 0, 0.5);
      box-shadow: 0 0 0 3px rgba(244, 180, 0, 0.15);
    }
    label {
      display: block; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 6px;
    }
    .field { margin-bottom: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 18px; margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .card.hero-card {
      background: linear-gradient(160deg, #1a1a1a 0%, #141414 100%);
      border-color: var(--border);
      position: relative; overflow: hidden;
    }
    .card.hero-card::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 90% 10%, rgba(244,180,0,0.18), transparent 50%);
      pointer-events: none;
    }
    .section-label {
      font-size: 0.65rem; font-weight: 800; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-title {
      font-family: var(--display); font-size: 1.35rem; font-weight: 800;
      letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .grid { display: grid; gap: 12px; }
    @media (min-width: 640px) {
      .grid.cols-2 { grid-template-columns: 1fr 1fr; }
      .grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
      .app { max-width: 900px; }
    }
    nav.tabs {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 16px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    nav.tabs::-webkit-scrollbar { display: none; }
    nav.tabs button {
      flex: 0 0 auto; background: var(--panel); color: var(--muted);
      border: 1px solid var(--border-soft); font-size: 0.8rem; font-weight: 600;
      padding: 10px 16px; border-radius: 999px; box-shadow: none;
    }
    nav.tabs button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #0a0a0a; border-color: transparent;
      box-shadow: 0 4px 14px rgba(244, 180, 0, 0.3);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border-soft); }
    th {
      color: var(--faint); font-weight: 700; font-size: 0.65rem;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .login-wrap {
      min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background-image:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(244, 180, 0, 0.14), transparent);
    }
    .login-box { width: 100%; max-width: 400px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stat { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--elevated); border: 1px solid var(--border);
      padding: 12px 18px; border-radius: 14px; z-index: 50;
      max-width: 92vw; font-size: 0.9rem; font-weight: 500;
      box-shadow: var(--shadow);
    }
    .eq { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 0.82rem; color: var(--muted); }
    .hero-title {
      font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 800;
      letter-spacing: -0.03em; line-height: 1.15; margin: 8px 0 10px;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700;
      background: var(--accent-soft); color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-box card hero-card">
      <div class="brand" style="margin-bottom:16px">
        <div class="logo">Á</div>
        <div>
          <div>ÁbacoPhy</div>
          <div class="muted">Tu negocio encuentra su orden</div>
        </div>
      </div>
      <form id="loginForm">
        <div class="field">
          <label for="campoUsuario">Usuario</label>
          <input id="campoUsuario" autocomplete="username" required value="admin" />
        </div>
        <div class="field">
          <label for="campoClave">Contraseña</label>
          <input id="campoClave" type="password" autocomplete="current-password" required value="admin123" />
        </div>
        <button type="submit" style="width:100%">Iniciar sesión</button>
      </form>
      <p class="muted" style="margin-top:12px">Las credenciales no se muestran en pantalla. Consulte la documentación interna del despliegue.</p>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <header class="top">
      <div class="brand">
        <div class="logo">Á</div>
        <div>
          <div id="tenantName">ÁbacoPhy</div>
          <div class="muted" id="userMeta"></div>
        </div>
      </div>
      <div class="row">
        <span id="netBadge" class="badge">En línea</span>
        <button type="button" class="ghost" id="btnSync">Sincronizar</button>
        <button type="button" class="ghost" id="btnLogout">Salir</button>
      </div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <main id="main"></main>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
  const API = (function () {
    const h = location.hostname;
    if (h === "localhost" || h === "127.0.0.1") return location.origin + "/api/v1";
    if (h.includes("abacophy")) return location.origin + "/api/v1";
    return "https://abacophy.onrender.com/api/v1";
  })();
  const state = {
    token: localStorage.getItem("ap_token") || "",
    user: null,
    tenant: null,
    views: [],
    tab: "dashboard",
    offlineQueue: JSON.parse(localStorage.getItem("ap_queue") || "[]"),
    cache: JSON.parse(localStorage.getItem("ap_cache") || "{}"),
  };

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    setTimeout(() => el.classList.add("hidden"), 2800);
  }

  function setOnline(on) {
    const b = document.getElementById("netBadge");
    b.textContent = on ? "En línea" : "Sin conexión";
    b.className = "badge" + (on ? "" : " off");
  }

  async function api(path, opts = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (state.token) headers.Authorization = "Bearer " + state.token;
    try {
      const res = await fetch(API + path, { ...opts, headers });
      setOnline(true);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    } catch (e) {
      setOnline(false);
      throw e;
    }
  }

  function saveLocal() {
    localStorage.setItem("ap_token", state.token || "");
    localStorage.setItem("ap_queue", JSON.stringify(state.offlineQueue));
    localStorage.setItem("ap_cache", JSON.stringify(state.cache));
  }

  function queueAction(action) {
    state.offlineQueue.push({ ...action, ts: Date.now() });
    saveLocal();
    toast("Guardado offline · se sincronizará al conectar");
  }

  async function flushQueue() {
    if (!state.token || !navigator.onLine || !state.offlineQueue.length) return;
    const entries = state.offlineQueue.filter((x) => x.kind === "entry").map((x) => x.payload);
    const invoices = state.offlineQueue.filter((x) => x.kind === "invoice").map((x) => x.payload);
    const inventory = state.offlineQueue.filter((x) => x.kind === "inventory").map((x) => x.payload);
    try {
      await api("/sync/push", {
        method: "POST",
        body: JSON.stringify({ entries, invoices, inventory, client_rev: state.cache.rev || 0 }),
      });
      state.offlineQueue = [];
      saveLocal();
      toast("Sincronización completa");
      await loadDashboard();
    } catch (e) {
      toast("No se pudo sincronizar aún");
    }
  }

  document.getElementById("loginForm").onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      const data = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({
          username: document.getElementById("campoUsuario").value.trim(),
          password: document.getElementById("campoClave").value,
        }),
      });
      state.token = data.token;
      state.user = data.user;
      state.views = data.views || [];
      document.getElementById("campoClave") && (document.getElementById("campoClave").value = "");
      saveLocal();
      await bootApp();
    } catch (e) {
      toast(e.message || "Error de acceso");
    }
  };

  document.getElementById("btnLogout").onclick = async () => {
    try { await api("/auth/logout", { method: "POST" }); } catch (_) {}
    state.token = "";
    state.user = null;
    saveLocal();
    location.reload();
  };

  document.getElementById("btnSync").onclick = () => flushQueue();

  window.addEventListener("online", () => { setOnline(true); flushQueue(); });
  window.addEventListener("offline", () => setOnline(false));

  const TAB_DEFS = [
    { id: "dashboard", label: "Inicio", view: "dashboard" },
    { id: "ingresos", label: "Ingresos", view: "ingresos" },
    { id: "gastos", label: "Gastos", view: "gastos" },
    { id: "inventario", label: "Inventario", view: "inventario" },
    { id: "facturas", label: "Facturas", view: "facturas" },
    { id: "nomina", label: "Nómina", view: "nomina" },
    { id: "cuentas", label: "Cuentas", view: "cuentas" },
    { id: "tenant", label: "Negocio", view: "tenant" },
    { id: "master", label: "Master", view: "master" },
  ];

  function renderTabs() {
    const nav = document.getElementById("tabs");
    nav.innerHTML = "";
    TAB_DEFS.filter((t) => state.views.includes(t.view)).forEach((t) => {
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = state.tab === t.id ? "active" : "";
      b.onclick = () => { state.tab = t.id; renderTabs(); renderMain(); };
      nav.appendChild(b);
    });
  }

  async function loadDashboard() {
    try {
      const me = await api("/auth/me");
      state.user = me.user;
      state.tenant = me.tenant;
      state.views = me.views || state.views;
      state.cache.rev = me.rev;
      state.cache.root_cid = me.root_cid;
      document.getElementById("tenantName").textContent = me.tenant.name || "ÁbacoPhy";
      document.getElementById("userMeta").textContent =
        (me.user.display_name || me.user.username) + " · " + me.user.role;
      saveLocal();
    } catch (_) {}
  }

  async function renderMain() {
    const main = document.getElementById("main");
    main.innerHTML = "<p class='muted'>Cargando…</p>";
    try {
      if (state.tab === "dashboard") {
        const rep = await api("/reports/summary").catch(() => null);
        const eq = (rep && rep.ecuacion) || {};
        const fmt = (n) => (Number(n) || 0).toFixed(2);
        main.innerHTML = `
          <div class="card hero-card" style="margin-bottom:16px">
            <div class="section-label">Panel</div>
            <div class="hero-title">Tu contabilidad, en un vistazo</div>
            <p class="muted">Partida doble y ecuación ampliada, con rastro CID.</p>
          </div>
          <div class="grid cols-3">
            <div class="card"><div class="section-label">Ingresos</div><div class="stat">${fmt(rep && rep.income_total)}</div></div>
            <div class="card"><div class="section-label">Gastos</div><div class="stat">${fmt(rep && rep.expense_total)}</div></div>
            <div class="card"><div class="section-label">Neto</div><div class="stat">${fmt(rep && rep.net)}</div></div>
          </div>
          <div class="card">
            <div class="section-label">Ecuación ampliada</div>
            <div class="section-title" style="font-size:1.1rem">Activo = Pasivo + Patrimonio + (I − G)</div>
            <p class="eq" style="margin-top:10px">
              Activo ${fmt(eq.activo)} = Pasivo ${fmt(eq.pasivo)} + Patrimonio ${fmt(eq.patrimonio)} + (${fmt(eq.ingresos)} − ${fmt(eq.gastos)})
            </p>
            <p class="muted" style="margin-top:12px">Cada movimiento actualiza Caja y la cuenta de resultado a la vez.</p>
            <div class="row" style="margin-top:12px">
              <span class="pill">Rev ${state.cache.rev || 0}</span>
              <span class="muted" style="font-size:0.75rem">CID ${(state.cache.root_cid||"—").slice(0,20)}…</span>
              <span class="muted" style="font-size:0.75rem">Cola offline: ${state.offlineQueue.length}</span>
            </div>
          </div>`;
      } else if (state.tab === "ingresos" || state.tab === "gastos") {
        const type = state.tab === "ingresos" ? "income" : "expense";
        const acc = await api("/accounts");
        const accounts = (acc.accounts || []).filter((a) =>
          type === "income" ? a.type === "income" : a.type === "expense"
        );
        main.innerHTML = `
          <div class="card">
            <h3 style="margin-bottom:12px">${type === "income" ? "Registrar ingreso" : "Registrar gasto"}</h3>
            <p class="muted" style="margin-bottom:12px">Partida doble: actualiza la cuenta de resultado y la Caja (activo).</p>
            <h3 style="display:none"></h3>
            <div class="field"><label>Importe</label><input id="amt" type="number" step="0.01" min="0" /></div>
            <div class="field"><label>Cuenta</label>
              <select id="acc">${accounts.map((a) => `<option value="${a.id}">${a.code} — ${a.name}</option>`).join("")}</select>
            </div>
            <div class="field"><label>Descripción</label><input id="desc" /></div>
            <button id="saveEntry">Guardar</button>
          </div>`;
        document.getElementById("saveEntry").onclick = async () => {
          const payload = {
            type, amount: parseFloat(document.getElementById("amt").value || "0"),
            account_id: document.getElementById("acc").value,
            description: document.getElementById("desc").value.trim(),
          };
          try {
            await api("/entries", { method: "POST", body: JSON.stringify(payload) });
            toast("Registrado");
            state.tab = "dashboard";
            renderTabs();
            renderMain();
          } catch (_) {
            queueAction({ kind: "entry", payload });
          }
        };
      } else if (state.tab === "inventario") {
        const data = await api("/inventory");
        const rows = (data.items || []).map((i) =>
          `<tr><td>${i.name}</td><td>${i.qty} ${i.unit}</td><td>${i.price}</td></tr>`
        ).join("");
        main.innerHTML = `
          <div class="card">
            <div class="field"><label>Nombre</label><input id="iname" /></div>
            <div class="grid cols-2">
              <div class="field"><label>Cantidad</label><input id="iqty" type="number" step="0.01" value="0" /></div>
              <div class="field"><label>Precio</label><input id="iprice" type="number" step="0.01" value="0" /></div>
            </div>
            <button id="addInv">Agregar al inventario</button>
          </div>
          <div class="card"><table><thead><tr><th>Producto</th><th>Stock</th><th>Precio</th></tr></thead><tbody>${rows || "<tr><td colspan=3 class='muted'>Vacío</td></tr>"}</tbody></table></div>`;
        document.getElementById("addInv").onclick = async () => {
          const payload = {
            name: document.getElementById("iname").value.trim(),
            qty: parseFloat(document.getElementById("iqty").value || "0"),
            price: parseFloat(document.getElementById("iprice").value || "0"),
            unit: "ud",
          };
          try {
            await api("/inventory", { method: "POST", body: JSON.stringify(payload) });
            toast("Producto agregado");
            renderMain();
          } catch (_) {
            queueAction({ kind: "inventory", payload });
          }
        };
      } else if (state.tab === "facturas") {
        const data = await api("/invoices");
        const rows = (data.invoices || []).map((f) =>
          `<tr><td>${f.number}</td><td>${f.client_name}</td><td>${f.total}</td><td>${f.status}</td>
            <td><button type="button" class="ghost" data-pdf="${f.id}">PDF</button></td></tr>`
        ).join("");
        main.innerHTML = `
          <div class="card">
            <div class="field"><label>Cliente</label><input id="fclient" /></div>
            <div class="field"><label>Concepto</label><input id="fdesc" value="Servicio" /></div>
            <div class="grid cols-2">
              <div class="field"><label>Cantidad</label><input id="fqty" type="number" value="1" /></div>
              <div class="field"><label>Precio unitario</label><input id="fprice" type="number" step="0.01" value="0" /></div>
            </div>
            <button id="addInvF">Emitir factura</button>
          </div>
          <div class="card"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Total</th><th>Estado</th><th>PDF</th></tr></thead><tbody>${rows || ""}</tbody></table></div>`;
        document.getElementById("addInvF").onclick = async () => {
          const qty = parseFloat(document.getElementById("fqty").value || "1");
          const price = parseFloat(document.getElementById("fprice").value || "0");
          const payload = {
            client_name: document.getElementById("fclient").value.trim() || "Cliente",
            lines: [{ description: document.getElementById("fdesc").value.trim(), qty, unit_price: price }],
            status: "issued",
            issued_at: new Date().toISOString().slice(0, 10),
          };
          try {
            await api("/invoices", { method: "POST", body: JSON.stringify(payload) });
            toast("Factura creada");
            renderMain();
          } catch (_) {
            queueAction({ kind: "invoice", payload });
          }
        };
      
        main.querySelectorAll("[data-pdf]").forEach((btn) => {
          btn.onclick = async () => {
            try {
              const res = await fetch(API + "/invoices/pdf?id=" + encodeURIComponent(btn.dataset.pdf), {
                headers: { Authorization: "Bearer " + state.token },
              });
              if (!res.ok) throw new Error("No se pudo generar el PDF");
              const blob = await res.blob();
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url; a.download = "factura.pdf"; a.click();
              URL.revokeObjectURL(url);
            } catch (e) { toast(e.message); }
          };
        });
} else if (state.tab === "nomina") {
        const data = await api("/payroll/employees");
        const rows = (data.employees || []).map((e) =>
          `<tr><td>${e.name}</td><td>${e.role || "—"}</td><td>${e.salary} ${e.currency}</td></tr>`
        ).join("");
        main.innerHTML = `
          <div class="card">
            <div class="field"><label>Nombre</label><input id="ename" /></div>
            <div class="field"><label>Cargo</label><input id="erole" /></div>
            <div class="field"><label>Salario</label><input id="esal" type="number" step="0.01" /></div>
            <button id="addEmp">Alta empleado</button>
          </div>
          <div class="card"><table><thead><tr><th>Nombre</th><th>Cargo</th><th>Salario</th></tr></thead><tbody>${rows || ""}</tbody></table></div>`;
        document.getElementById("addEmp").onclick = async () => {
          await api("/payroll/employees", {
            method: "POST",
            body: JSON.stringify({
              name: document.getElementById("ename").value.trim(),
              role: document.getElementById("erole").value.trim(),
              salary: parseFloat(document.getElementById("esal").value || "0"),
            }),
          });
          toast("Empleado registrado");
          renderMain();
        };
      } else if (state.tab === "cuentas") {
        const data = await api("/accounts");
        const rows = (data.accounts || []).map((a) =>
          `<tr><td>${a.code}</td><td>${a.name}</td><td>${a.type}</td><td>${a.balance}</td></tr>`
        ).join("");
        main.innerHTML = `<div class="card"><table><thead><tr><th>Código</th><th>Cuenta</th><th>Tipo</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      } else if (state.tab === "tenant") {
        const t = state.tenant || {};
        main.innerHTML = `
          <div class="card">
            <div class="field"><label>Nombre del negocio</label><input id="tname" value="${t.name || ""}" /></div>
            <div class="field"><label>Moneda</label><input id="tcur" value="${t.currency || "CUP"}" /></div>
            <div class="field"><label>Teléfono</label><input id="tphone" value="${t.phone || ""}" /></div>
            <div class="field"><label>Dirección</label><input id="taddr" value="${t.address || ""}" /></div>
            <button id="saveT">Guardar personalización</button>
          </div>`;
        document.getElementById("saveT").onclick = async () => {
          const updated = await api("/tenant", {
            method: "PUT",
            body: JSON.stringify({
              name: document.getElementById("tname").value.trim(),
              currency: document.getElementById("tcur").value.trim(),
              phone: document.getElementById("tphone").value.trim(),
              address: document.getElementById("taddr").value.trim(),
            }),
          });
          state.tenant = updated;
          document.getElementById("tenantName").textContent = updated.name;
          toast("Negocio actualizado");
        };
      } else if (state.tab === "master") {
        const data = await api("/master/tenants");
        main.innerHTML = `<div class="card"><pre class="muted" style="white-space:pre-wrap">${JSON.stringify(data.tenants, null, 2)}</pre></div>`;
      }
    } catch (e) {
      main.innerHTML = `<div class="card muted">No se pudo cargar la vista (${e.message}). Prueba sincronizar o revisa la conexión.</div>`;
    }
  }

  async function bootApp() {
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("appView").classList.remove("hidden");
    await loadDashboard();
    renderTabs();
    await renderMain();
    flushQueue();
  }

  async function trySession() {
    if (!state.token) return;
    try {
      await loadDashboard();
      await bootApp();
    } catch (_) {
      state.token = "";
      saveLocal();
    }
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
  // serve manifest from same origin path helpers
  trySession();
  </script>
</body>
</html>
