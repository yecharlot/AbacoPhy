<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4B400" />
  <title>ÁbacoPhy</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      --primary: #C9920A;
      --primary-dark: #A67A08;
      --primary-soft: rgba(201,146,10,.12);
      --bg: #F7F4EC;
      --bg-elevated: #FFFFFF;
      --bg-sidebar: #FFFcf7;
      --text: #1A1A1A;
      --text-secondary: #5C5C5C;
      --text-muted: #8A8A8A;
      --border: rgba(26,26,26,.08);
      --shadow: 0 8px 28px rgba(26,26,26,.06);
      --ok: #2E7D32;
      --danger: #C62828;
      --sidebar-w: 260px;
    }
    [data-theme="dark"] {
      --primary: #F4B400;
      --primary-dark: #FB8C00;
      --primary-soft: rgba(244,180,0,.14);
      --bg: #0A0A0A;
      --bg-elevated: #141414;
      --bg-sidebar: #0F0F0F;
      --text: #FFFFFF;
      --text-secondary: #B0B0B0;
      --text-muted: #6B6B6B;
      --border: rgba(244,180,0,.15);
      --shadow: 0 8px 32px rgba(0,0,0,.4);
      --ok: #4CAF50;
      --danger: #FF5252;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }
    .hidden { display: none !important; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: none;} }

    #loginOverlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #fff8e7, var(--bg));
      padding: 20px;
    }
    [data-theme="dark"] #loginOverlay {
      background: radial-gradient(ellipse at 50% 40%, #121212, #050505);
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 28px; padding: 2rem;
      box-shadow: var(--shadow); text-align: center;
      animation: fadeUp .45s ease;
    }
    .login-card h2 { font-weight: 800; margin: .6rem 0 .25rem; letter-spacing: -.02em; }
    .login-card .muted { color: var(--text-secondary); font-size: .9rem; margin-bottom: 1.25rem; }
    .logo-mark {
      width: 52px; height: 52px; margin: 0 auto; border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: grid; place-items: center;
      box-shadow: 0 6px 18px var(--primary-soft);
    }
    .logo-mark img, .logo-mark svg { width: 28px; height: 28px; }

    #appShell { display: none; min-height: 100dvh; }
    #appShell.on { display: block; }

    .sidebar {
      width: var(--sidebar-w); position: fixed; inset: 0 auto 0 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 100;
      transition: transform .25s ease;
    }
    .sidebar-header {
      flex-shrink: 0; padding: 1.15rem 1.1rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg-sidebar); z-index: 2;
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-row h3 { font-size: .95rem; font-weight: 800; }
    .brand-row p { font-size: .65rem; color: var(--text-muted); }
    .nav { flex: 1; overflow-y: auto; padding: .55rem 0 1.25rem; -webkit-overflow-scrolling: touch; }
    .nav-item {
      margin: .15rem .55rem; padding: .7rem .9rem; border-radius: 12px;
      display: flex; align-items: center; gap: 10px; width: calc(100% - 1.1rem);
      color: var(--text-secondary); font-weight: 500; font-size: .88rem;
      cursor: pointer; border: none; background: transparent; font-family: inherit; text-align: left;
      transition: background .2s, color .2s, transform .2s;
    }
    .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; flex-shrink: 0; }
    .nav-item:hover { background: var(--primary-soft); color: var(--primary); transform: translateX(3px); }
    .nav-item.active {
      background: var(--primary-soft); color: var(--primary);
      border-left: 3px solid var(--primary); font-weight: 600;
    }

    .main { margin-left: var(--sidebar-w); padding: 1.25rem; min-height: 100dvh; animation: fadeUp .35s ease; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
    .topbar h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
    .badge {
      font-size: .62rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--primary-soft); color: var(--primary);
    }
    .badge.syncing { background: rgba(201,146,10,.2); }
    .badge.off { color: var(--danger); background: rgba(198,40,40,.08); border-color: rgba(198,40,40,.25); }
    .badge.ok { color: var(--ok); background: rgba(46,125,50,.1); border-color: rgba(46,125,50,.25); }

    .card {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 18px; padding: 1.1rem; margin-bottom: .9rem; box-shadow: var(--shadow);
      animation: fadeUp .3s ease;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .85rem; margin-bottom: .9rem; }
    .stat-card {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem; text-align: center; transition: transform .2s, border-color .2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .stat-card h3 { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-top: .25rem; }
    .stat-card small { color: var(--text-muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }

    label {
      display: block; font-size: .65rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%; padding: 11px 13px; margin-bottom: .75rem;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: inherit; font-size: .92rem;
    }
    [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea {
      background: #1A1A1A;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn {
      padding: 10px 18px; border-radius: 40px; border: none; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
      font-family: inherit; font-size: .88rem; transition: transform .2s, box-shadow .2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #0A0A0A; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 18px var(--primary-soft); }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 11px; font-size: .74rem; border-radius: 20px; }
    .btn-danger { background: var(--danger); color: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
    .section-label { font-size: .65rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }
    .muted { color: var(--text-secondary); font-size: .88rem; }
    .money { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--primary); }
    .eq { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--text-secondary); line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { text-align: left; padding: 9px 7px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--bg-elevated); border: 1px solid var(--border);
      padding: 11px 16px; border-radius: 14px; z-index: 2000; max-width: 92vw;
      box-shadow: var(--shadow); animation: fadeUp .25s ease;
    }
    .menu-toggle {
      display: none; background: transparent; border: 1px solid var(--border);
      border-radius: 10px; padding: 7px; color: var(--primary); cursor: pointer;
    }
    .menu-toggle svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .overlay-side { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 90; }
    .overlay-side.on { display: block; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .tab {
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); cursor: pointer; font-size: .82rem; font-weight: 600; font-family: inherit;
    }
    .tab.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 1rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .menu-toggle { display: inline-flex !important; }
    }
    @media (max-width: 420px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .topbar h1 { font-size: 1.05rem; }
      table { font-size: .78rem; }
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-card">
      <div class="logo-mark"><img src="/icon.svg" alt="" width="28" height="28" /></div>
      <h2>Ábaco<span style="color:var(--primary)">Phy</span></h2>
      <p class="muted">Sistema Contable para Negocios</p>
      <form id="formAcceso">
        <label for="campoUsuario">Usuario</label>
        <input id="campoUsuario" autocomplete="username" required />
        <label for="campoClave">Contraseña</label>
        <input id="campoClave" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <div id="appShell">
    <div class="overlay-side" id="overlaySide"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-row">
          <div class="logo-mark" style="width:40px;height:40px;border-radius:12px"><img src="/icon.svg" width="22" height="22" alt="" /></div>
          <div>
            <h3 id="sideTitle">ÁbacoPhy</h3>
            <p id="sideSub">Negocio</p>
          </div>
        </div>
        <p class="muted" style="margin-top:8px;font-size:.75rem" id="sideUser"></p>
      </div>
      <nav class="nav" id="sideNav"></nav>
    </aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button type="button" class="menu-toggle" id="btnMenu" aria-label="Menú">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 id="pageTitle">Inicio</h1>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge" id="estadoRed">En línea</span>
          <button type="button" class="btn btn-secondary btn-sm" id="btnTema" title="Tema">Tema</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnSalir">Salir</button>
        </div>
      </div>
      <div id="principal"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

<script>
const API = (function(){
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1') return location.origin + '/api/v1';
  if (h.includes('abacophy')) return location.origin + '/api/v1';
  return 'https://abacophy.onrender.com/api/v1';
})();

const ICONS = {
  inicio: '<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  ingresos: '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg>',
  gastos: '<svg viewBox="0 0 24 24"><path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M5 3h14"/></svg>',
  inventario: '<svg viewBox="0 0 24 24"><path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l2-3h14l2 3"/></svg>',
  facturas: '<svg viewBox="0 0 24 24"><path d="M7 3h10v18l-2-1-2 1-2-1-2 1-2-1-2 1V3z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  nomina: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  cuentas: '<svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 10h16v10H4z"/><path d="M8 14h2m4 0h2"/></svg>',
  monedas: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10m-3-7.5c0-1 1.5-1.5 3-1.5s3 .5 3 1.5-1.5 1.5-3 1.5-3 .5-3 1.5 1.5 1.5 3 1.5 3-.5 3-1.5"/></svg>',
  informes: '<svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16"/><path d="M8 17V10m4 7V7m4 10v-4"/></svg>',
  traza: '<svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
  salvas: '<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h9l5 5v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 5v5h5M8 17h8"/></svg>',
  negocio: '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg>',
  master: '<svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V7l-8-4z"/></svg>',
  tema: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>',
};

const NAV = [
  { id: 'inicio', label: 'Inicio', view: 'dashboard', icon: 'inicio' },
  { id: 'ingresos', label: 'Ingresos', view: 'ingresos', icon: 'ingresos' },
  { id: 'gastos', label: 'Gastos', view: 'gastos', icon: 'gastos' },
  { id: 'inventario', label: 'Inventario', view: 'inventario', icon: 'inventario' },
  { id: 'facturas', label: 'Facturas', view: 'facturas', icon: 'facturas' },
  { id: 'nomina', label: 'Nómina', view: 'nomina', icon: 'nomina' },
  { id: 'cuentas', label: 'Nomenclador de cuentas', view: 'cuentas', icon: 'cuentas' },
  { id: 'monedas', label: 'Monedas', view: 'monedas', icon: 'monedas' },
  { id: 'informes', label: 'Informes', view: 'reportes', icon: 'informes' },
  { id: 'traza', label: 'Traza', view: 'traza', icon: 'traza' },
  { id: 'salvas', label: 'Salvas', view: 'salvas', icon: 'salvas' },
  { id: 'negocio', label: 'Negocio', view: 'tenant', icon: 'negocio' },
  { id: 'tema', label: 'Apariencia', view: 'master', icon: 'tema' },
  { id: 'master', label: 'Master', view: 'master', icon: 'master' },
];

const state = {
  token: localStorage.getItem('ap_token') || '',
  user: null, tenant: null, views: [], tab: 'inicio',
  informeSub: 'situacion',
  queue: JSON.parse(localStorage.getItem('ap_queue') || '[]'),
  cache: JSON.parse(localStorage.getItem('ap_cache') || '{}'),
  themeMode: localStorage.getItem('ap_theme') || 'light',
};

function applyThemeMode(mode) {
  state.themeMode = mode || 'light';
  document.documentElement.setAttribute('data-theme', state.themeMode);
  localStorage.setItem('ap_theme', state.themeMode);
}
applyThemeMode(state.themeMode);

function money(n, cur) {
  const c = cur || (state.tenant && state.tenant.currency) || 'CUP';
  return `${(Number(n)||0).toFixed(2)} ${c}`;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2800);
}
function setRed(ok, text) {
  const b = document.getElementById('estadoRed');
  if (text) { b.textContent = text; b.className = 'badge syncing'; return; }
  b.textContent = ok ? 'En línea' : 'Sin conexión';
  b.className = 'badge' + (ok ? ' ok' : ' off');
}
function saveLocal() {
  localStorage.setItem('ap_token', state.token || '');
  localStorage.setItem('ap_queue', JSON.stringify(state.queue));
  localStorage.setItem('ap_cache', JSON.stringify(state.cache));
}
async function api(path, opts={}) {
  const headers = Object.assign({}, opts.headers || {});
  if (!(opts.body instanceof FormData)) headers['Content-Type'] = headers['Content-Type'] || 'application/json';
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  try {
    const res = await fetch(API + path, {...opts, headers});
    setRed(true);
    if (path.includes('/pdf') || path.includes('/export')) return res;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  } catch (e) { setRed(false); throw e; }
}
async function notifySync(status, detail) {
  try {
    await api('/sync/notify', { method: 'POST', body: JSON.stringify({ status, detail }) });
  } catch (_) {}
}
async function autoSync() {
  if (!state.token || !state.queue.length) return;
  if (!navigator.onLine) return;
  setRed(true, 'Sincronizando…');
  await notifySync('started', 'Sincronización automática iniciada · '+state.queue.length+' operaciones en cola · '+new Date().toISOString());
  try {
    await api('/sync/push', { method: 'POST', body: JSON.stringify({
      entries: state.queue.filter(x => x.kind === 'entry').map(x => x.payload),
      invoices: state.queue.filter(x => x.kind === 'invoice').map(x => x.payload),
      inventory: state.queue.filter(x => x.kind === 'inventory').map(x => x.payload),
      client_rev: state.cache.rev || 0,
    })});
    const n = state.queue.length;
    state.queue = []; saveLocal();
    await notifySync('ok', 'Sincronización automática completada · '+n+' operaciones enviadas · '+new Date().toISOString());
    setRed(true); toast('Sincronización completada');
  } catch (e) {
    await notifySync('error', 'Error en sincronización automática: '+(e.message||'desconocido')+' · '+new Date().toISOString());
    setRed(false); toast('Sync pendiente');
  }
}
window.addEventListener('online', () => { setRed(true); autoSync(); });
window.addEventListener('offline', () => setRed(false));
setInterval(() => { if (navigator.onLine && state.queue.length) autoSync(); }, 45000);

document.getElementById('formAcceso').onsubmit = async (ev) => {
  ev.preventDefault();
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        username: document.getElementById('campoUsuario').value.trim(),
        password: document.getElementById('campoClave').value,
      }),
    });
    state.token = data.token; state.user = data.user; state.views = data.views || [];
    document.getElementById('campoClave').value = ''; saveLocal(); await boot();
  } catch (e) { toast(e.message || 'No se pudo iniciar sesión'); }
};
document.getElementById('btnSalir').onclick = async () => {
  try { await api('/auth/logout', { method: 'POST' }); } catch (_) {}
  state.token = ''; saveLocal(); location.reload();
};
document.getElementById('btnTema').onclick = () => {
  applyThemeMode(state.themeMode === 'light' ? 'dark' : 'light');
  toast(state.themeMode === 'light' ? 'Tema claro' : 'Tema oscuro');
};
document.getElementById('btnMenu').onclick = () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlaySide').classList.toggle('on');
};
document.getElementById('overlaySide').onclick = () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlaySide').classList.remove('on');
};

function can(view) {
  if (view === 'dashboard') return state.views.includes('dashboard') || state.views.length;
  if (view === 'reportes') return state.views.includes('reportes') || state.views.includes('cuentas');
  return state.views.includes(view);
}
function renderNav() {
  const nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  NAV.filter(n => {
    if (n.id === 'tema' || n.id === 'master') return state.user && state.user.role === 'master';
    return can(n.view);
  }).forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'nav-item' + (state.tab === n.id ? ' active' : '');
    b.innerHTML = (ICONS[n.icon] || '') + '<span>' + n.label + '</span>';
    b.onclick = () => {
      state.tab = n.id;
      document.getElementById('pageTitle').textContent = n.label;
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlaySide').classList.remove('on');
      renderNav(); render();
    };
    nav.appendChild(b);
  });
}
async function loadMe() {
  const me = await api('/auth/me');
  state.user = me.user; state.tenant = me.tenant; state.views = me.views || state.views;
  state.cache.rev = me.rev; state.cache.root_cid = me.root_cid;

          document.getElementById('repOut').innerHTML = `<div class="stats-grid">
            <div class="stat-card"><small>Ingresos</small><h3 class="money">${money(d.estado_rendimiento.ingresos, d.base_currency)}</h3></div>
            <div class="stat-card"><small>Gastos</small><h3 class="money">${money(d.estado_rendimiento.gastos, d.base_currency)}</h3></div>
            <div class="stat-card"><small>Resultado</small><h3 class="money">${money(d.estado_rendimiento.resultado, d.base_currency)}</h3></div>
          </div>
          <table style="margin-top:1rem"><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Importe</th><th>Ejecutor</th></tr></thead>
          <tbody>${(d.operaciones||[]).map(o=>`<tr><td>${o.date||''}</td><td>${o.type}</td><td>${o.description||''}</td><td class="money">${money(o.amount,o.currency||d.base_currency)}</td><td>${o.username||'—'}</td></tr>`).join('')}</tbody></table>`;
        }
      };
      document.getElementById('runRep').onclick = fill;
      document.getElementById('pdfRep').onclick = async () => {
        const q = '/reports/pdf?kind=' + encodeURIComponent(state.informeSub) + '&period=' + encodeURIComponent(document.getElementById('per').value)
          + (state.informeSub === 'cuenta_t' ? '&account_id=' + encodeURIComponent(document.getElementById('tid').value) : '');
        const res = await api(q);
        if (!res.ok) { toast('No se pudo generar el PDF'); return; }
        const blob = await res.blob(); const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'informe-' + state.informeSub + '.pdf'; a.click(); URL.revokeObjectURL(url);
      };
      fill().catch(() => {});
    } else if (state.tab === 'traza') {
      const data = await api('/audit');
      const rows = (data.audit || []).slice(0, 200).map(a => `<tr>
        <td>${(a.created_at || '').toString().slice(0, 19).replace('T', ' ')}</td>
        <td>${a.username || a.user_id || ''}</td>
        <td>${a.action}</td>
        <td>${a.detail || ''}</td></tr>`).join('');
      main.innerHTML = `<div class="card"><div class="section-label">Traza de operaciones</div>
        <p class="muted">Detalle en español · fecha y hora · origen de cada acción</p>
        <table><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="muted">Sin eventos</td></tr>'}</tbody></table></div>`;
    } else if (state.tab === 'salvas') {
      const data = await api('/backups');
      const rows = (data.backups || []).map(b => `<tr><td>${(b.created_at || '').toString().slice(0, 19)}</td><td>${b.label || '—'}</td>
        <td style="font-size:.75rem">${(b.cid || '').slice(0, 18)}…</td><td>${b.rev}</td>
        <td><button class="btn btn-secondary btn-sm" data-restore="${b.cid}">Restaurar</button></td></tr>`).join('');
      main.innerHTML = `<div class="card"><div class="section-label">Salvas</div>
        <label>Etiqueta</label><input id="blabel" placeholder="Cierre mensual" />
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" id="saveB">Guardar salva (CID)</button>
          <button class="btn btn-secondary" id="exportZ">Exportar ZIP a disco</button>
        </div>
        <div style="margin-top:1rem">
          <label>Restaurar desde archivo local (.zip o .json)</label>
          <input type="file" id="impFile" accept=".zip,.json,application/zip,application/json" />
          <button class="btn btn-secondary" id="importZ">Importar y restaurar</button>
        </div>
      </div>
      <div class="card"><table><thead><tr><th>Fecha</th><th>Etiqueta</th><th>CID</th><th>Rev</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">Sin salvas</td></tr>'}</tbody></table></div>`;
      document.getElementById('saveB').onclick = async () => {
        await api('/backups', { method: 'POST', body: JSON.stringify({ label: document.getElementById('blabel').value.trim() }) });
        toast('Salva anclada'); render();
      };
      document.getElementById('exportZ').onclick = async () => {
        const res = await api('/backups/export');
        if (!res.ok) { toast('No se pudo exportar'); return; }
        const blob = await res.blob(); const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'abacophy-salva.zip'; a.click(); URL.revokeObjectURL(url);
      };
      document.getElementById('importZ').onclick = async () => {
        const f = document.getElementById('impFile').files[0];
        if (!f) { toast('Elija un archivo'); return; }
        const fd = new FormData(); fd.append('file', f);
        await api('/backups/import', { method: 'POST', body: fd, headers: {} });
        toast('Restaurado desde disco'); await loadMe(); render();
      };
      main.querySelectorAll('[data-restore]').forEach(b => b.onclick = async () => {
        if (!confirm('¿Restaurar esta salva?')) return;
        await api('/backups/restore', { method: 'POST', body: JSON.stringify({ cid: b.dataset.restore }) });
        toast('Restaurado'); await loadMe(); render();
      });
    } else if (state.tab === 'negocio') {
      const t = state.tenant || {};
      main.innerHTML = `<div class="card">
        <label>Nombre del negocio</label><input id="tname" value="${t.name || ''}" />
        <label>Moneda base</label><input id="tcur" value="${t.currency || 'CUP'}" />
        <label>Teléfono</label><input id="tphone" value="${t.phone || ''}" />
        <label>Dirección</label><input id="taddr" value="${t.address || ''}" />
        <button class="btn btn-primary" id="saveT">Guardar</button>
      </div>`;
      document.getElementById('saveT').onclick = async () => {
        const u = await api('/tenant', { method: 'PUT', body: JSON.stringify({ name: document.getElementById('tname').value.trim(), currency: document.getElementById('tcur').value.trim(), phone: document.getElementById('tphone').value.trim(), address: document.getElementById('taddr').value.trim() }) });
        state.tenant = u; document.getElementById('sideSub').textContent = u.name; toast('Negocio actualizado');
      };
    } else if (state.tab === 'tema' && state.user && state.user.role === 'master') {
      const th = await api('/theme');
      const s = th.settings || {};
      main.innerHTML = `<div class="card"><div class="section-label">Apariencia (solo master)</div>
        <label>Título de la app</label><input id="apptitle" value="${s.app_title || 'ÁbacoPhy'}" />
        <label>Nombre del negocio por defecto</label><input id="thname" value="${th.name || ''}" />
        <label>Color primario</label><input id="thpri" type="color" value="${s.primary || '#C9920A'}" />
        <label>Color primario oscuro</label><input id="thprid" type="color" value="${s.primary_dark || '#A67A08'}" />
        <button class="btn btn-primary" id="saveTh">Aplicar</button>
      </div>`;
      document.getElementById('saveTh').onclick = async () => {
        await api('/theme', { method: 'PUT', body: JSON.stringify({
          app_title: document.getElementById('apptitle').value.trim(),
          name: document.getElementById('thname').value.trim(),
          primary: document.getElementById('thpri').value.trim(),
          primary_dark: document.getElementById('thprid').value.trim(),
        })});
        toast('Apariencia actualizada'); await loadMe(); renderNav();
      };
    } else if (state.tab === 'master' && state.user && state.user.role === 'master') {
      const tenants = await api('/master/tenants');
      let errs = { errors: [] }; try { errs = await api('/errors'); } catch (_) {}
      main.innerHTML = `<div class="card"><div class="section-label">Master · negocios</div>
        <pre class="muted" style="white-space:pre-wrap;font-size:.8rem">${JSON.stringify(tenants.tenants, null, 2)}</pre></div>
      <div class="card"><div class="section-label">Errores / averías</div>
        <label>Registrar incidencia</label><input id="errd" />
        <button class="btn btn-primary" id="logErr">Registrar</button>
        <table style="margin-top:1rem"><thead><tr><th>Fecha</th><th>Detalle</th></tr></thead>
        <tbody>${(errs.errors || []).map(e => `<tr><td>${(e.created_at || '').toString().slice(0, 19)}</td><td>${e.detail || ''}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Sin errores</td></tr>'}</tbody></table>
      </div>`;
      document.getElementById('logErr').onclick = async () => {
        await api('/errors', { method: 'POST', body: JSON.stringify({ detail: document.getElementById('errd').value.trim() }) });
        toast('Incidencia registrada'); render();
      };
    }
  } catch (e) {
    main.innerHTML = `<div class="card muted">No se pudo cargar (${e.message})</div>`;
  }
}

async function boot() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appShell').classList.add('on');
  await loadMe(); renderNav(); await render(); autoSync();
}
async function trySession() {
  if (!state.token) return;
  try { await loadMe(); await boot(); } catch (_) { state.token = ''; saveLocal(); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
trySession();
</script>
</body>
</html>
